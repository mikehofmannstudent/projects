<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoWeb | Folders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-folders.css">
</head>
<body>
    <div id="addFolderBox" class="hidden">
        <h3>Create Folder</h3>
        <label for="foldername">Folder name:</label>
        <input type="text" id="folderName" name="folderName">
        <button id="createFolderBtn">Create Folder</button>
    </div>

    <div id="foldersGridContainer">
        <div class="button-wrapper">
            <button id="addFolderToggle" class="folderBox">+</button>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="delFolder bi bi-x" viewBox="0 0 16 16">
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
            </svg>
        </div>
    </div>

    <script src="../js/script-folders.js"></script>
</body>
</html>
