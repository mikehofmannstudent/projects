<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator v03</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <style>
        .display-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
            direction: rtl;
            text-align: right;
            max-width: 100%;
        }
        
        .display-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .display-content {
            display: inline-block;
            direction: ltr;
            text-align: right;
            min-width: 100%;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center">
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-2xl w-80">
            <!-- Calculator Display -->
            <div class="bg-white/20 rounded-xl p-4 mb-4 text-right">
                <div class="text-white/60 text-sm h-6" id="previousDisplay"></div>
                <div class="display-scroll">
                    <div class="display-content">
                        <span class="text-white text-3xl font-bold" id="currentDisplay">0</span>
                    </div>
                </div>
                <div class="text-white/40 text-xs h-4" id="ansDisplay">ANS: --</div>
            </div>

            <!-- Calculator Buttons -->
            <div class="grid grid-cols-4 gap-3">
                <!-- Row 1: Parentheses -->
                <button class="col-span-2 bg-purple-500/80 hover:bg-purple-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendParenthesis('(')">(</button>
                <button class="col-span-2 bg-purple-500/80 hover:bg-purple-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendParenthesis(')')">)</button>

                <!-- Row 2: Clear, Delete, Operators -->
                <button class="bg-red-500/80 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="clearAll()">AC</button>
                <button class="bg-yellow-500/80 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="deleteLast()">⌫</button>
                <button class="bg-orange-500/80 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendOperator('÷')">÷</button>
                <button class="bg-orange-500/80 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendOperator('×')">×</button>

                <!-- Row 3: Numbers 7-9, Subtraction -->
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('7')">7</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('8')">8</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('9')">9</button>
                <button class="bg-orange-500/80 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendOperator('-')">−</button>

                <!-- Row 4: Numbers 4-6, Addition -->
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('4')">4</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('5')">5</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('6')">6</button>
                <button class="bg-orange-500/80 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendOperator('+')">+</button>

                <!-- Row 5: Numbers 1-3, Equals -->
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('1')">1</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('2')">2</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('3')">3</button>
                <button class="row-span-2 bg-green-500/80 hover:bg-green-600 text-white font-bold rounded-xl transition-all hover:scale-105 active:scale-95" onclick="calculate()">=</button>
                
                <!-- Row 6: ANS, 0, Decimal -->
                <button class="bg-cyan-500/80 hover:bg-cyan-600 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendANS()">ANS</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('0')">0</button>
                <button class="bg-white/20 hover:bg-white/30 text-white font-bold py-3 rounded-xl transition-all hover:scale-105 active:scale-95" onclick="appendNumber('.')">.</button>
            </div>
        </div>
    </div>

    <script src="src/script.js"></script>
</body>
</html>
